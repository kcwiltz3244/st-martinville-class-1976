<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Gallery - SMSH Class of '76</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; }
    body { background:#f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
    .gallery-header { background: var(--school-purple); color: var(--school-gold); padding: 3rem 1rem; border-bottom: 4px solid var(--school-gold); }
    .photo-card { border: none; transition: transform 0.3s ease; background: white; }
    .photo-card:hover { transform: translateY(-5px); }
    .img-container { overflow: hidden; cursor: pointer; height: 250px; border-radius: 8px 8px 0 0; }
    .gallery-img { width: 100%; height: 100%; object-fit: cover; }
    .caption-bar { background: white; border-top: 1px solid #eee; border-radius: 0 0 8px 8px; }
    .photo-name { color: var(--school-purple); font-weight: bold; font-size: 0.9rem; margin-bottom: 0; }
    #btn-back { background: var(--school-gold); color: var(--school-purple); font-weight: bold; border-radius: 50px; }
    #lightboxCaption { background: rgba(0,0,0,0.8); color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; }
  </style>
</head>
