<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; color:#333; font-family: 'Segoe UI', Arial, sans-serif; }
    
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar-brand, .nav-link { color: var(--school-gold) !important; font-weight: bold; }

    h2 { color: var(--school-purple); font-weight: bold; margin-top: 2rem; }
    
    /* Gallery Styling */
    .photo-card {
      border: 2px solid #eee;
      transition: transform 0.3s ease, border-color 0.3s ease;
      background: white;
    }
    .photo-card:hover {
      transform: scale(1.03);
      border-color: var(--school-gold);
    }
    .img-container {
      height: 250px;
      overflow: hidden;
      background: #ddd;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* This keeps photos from looking stretched */
    }
    .card-body {
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--deep-purple);
      font-weight: 500;
    }
    .btn-back {
      background-color: var(--school-purple);
      color: var(--school-gold);
      border: 2px solid var(--school-gold);
      font-weight: bold;
      border-radius: 50px;
      padding: 10px 30px;
    }
    .btn-back:hover {
      background-color: var(--deep-purple);
      color: white;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="test.html">← BACK TO HOME</a>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center mb-5">
    <h2>Memories Through The Years</h2>
    <p class="text-muted">A collection of moments from St. Martinville Senior High.</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-4 col-md-6">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container">
          <img src="pic1.jpg" alt="Class of 1976 Photo">
        </div>
        <div class="card-body">
          School Days Memory
        </div>
      </div>
    </div>

    </div>

  <div class="text-center mt-5">
    <a href="test.html" class="btn btn-back">RETURN TO MAIN PAGE</a>
  </div>
</div>

<footer class="py-4 mt-5 text-center" style="background: #1e003c; color: var(--school-gold);">
  <small>&copy; 2026 SMSH – Class of 1976</small>
</footer>

</body>
</html>
