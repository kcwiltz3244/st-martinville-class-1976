<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Gallery - SMSH Class of '76</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; }
    body { background:#f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
    
    .gallery-header { background: var(--school-purple); color: var(--school-gold); padding: 3rem 1rem; border-bottom: 4px solid var(--school-gold); }
    
    .img-container { overflow: hidden; border-radius: 8px; cursor: pointer; background: #eee; height: 250px; }
    .gallery-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .img-container:hover .gallery-img { transform: scale(1.05); }

    #btn-back { background: var(--school-gold); color: var(--school-purple); font-weight: bold; border-radius: 50px; }
  </style>
</head>
<body>

<header class="gallery-header text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">50th Reunion Gallery</h1>
    <p class="lead">Capturing memories from 1976 to 2026</p>
    <a href="test.html" class="btn px-4 mt-3" id="btn-back">← Back to Main Page</a>
  </div>
</header>

<main class="container py-5">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="mainGallery">
    
    <div class="col">
      <div class="img-container shadow-sm" onclick="openLightbox('pic1.jpg')">
        <img src="pic1.jpg" class="gallery-img" alt="Memory 1">
      </div>
    </div>

    <div class="col">
      <div class="img-container shadow-sm" onclick="openLightbox('pic2.png')">
        <img src="pic2.png" class="gallery-img" alt="Memory 2">
      </div>
    </div>

    <div class="col">
      <div class="img-container shadow-sm" onclick="openLightbox('pic3.jpg')">
        <img src="pic3.jpg" class="gallery-img" alt="Memory 3">
      </div>
    </div>

    </div>
</main>

<div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0 text-center position-relative">
        <img src="" id="lightboxImg" class="img-fluid rounded shadow-lg">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    </div>
  </div>
</div>

<footer class="py-4 text-center border-top">
  <p class="text-muted small">&copy; 2026 St. Martinville Senior High - Class of 1976</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openLightbox(src) {
    const modalImg = document.getElementById('lightboxImg');
    modalImg.src = src;
    const myModal = new bootstrap.Modal(document.getElementById('photoModal'));
    myModal.show();
  }
</script>

</body>
</html>
