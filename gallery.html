<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; font-family: 'Segoe UI', Arial, sans-serif; }
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar-brand { color: var(--school-gold) !important; font-weight: bold; }
    .submission-box {
      background: white;
      border-left: 5px solid var(--school-gold);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 40px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 { color: var(--school-purple); font-weight: bold; }
    .photo-card { border-radius: 12px; overflow: hidden; background: white; border: 1px solid #ddd; transition: 0.3s; height: 100%; }
    .photo-card:hover { transform: translateY(-5px); border-color: var(--school-gold); }
    .img-container { height: 250px; background: #f0f0f0; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    .btn-back { background-color: var(--school-purple); color: var(--school-gold); border: 2px solid var(--school-gold); font-weight: bold; border-radius: 50px; padding: 12px 40px; text-decoration: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="test.html">← BACK TO HOME</a>
  </div>
</nav>

<div class="container py-5 text-center">
  <h2>Memory Gallery</h2>
  <p class="text-muted mb-5">St. Martinville Senior High — Class of 1976</p>

  <div class="submission-box mx-auto" style="max-width: 650px;">
    <h5 class="fw-bold" style="color: var(--deep-purple);">📸 Want to add your photos?</h5>
    <p class="mb-3">Click the address below to copy it, then paste it into your email to send us your pictures!</p>
    
    <button onclick="copyAndNotify()" id="mainEmailBtn" class="btn btn-lg w-100" 
            style="background-color: var(--school-purple); color: var(--school-gold); border-radius: 10px; padding: 15px; font-weight: bold; border: 2px solid var(--school-gold); font-size: 1.1rem;">
            smshclassof76photos@gmail.com
    </button>
    
    <p id="instructionText" class="mt-3 text-muted fw-bold">
        (Click the box above to copy)
    </p>
  </div>

  <div class="row g-4 mt-2" id="photoGrid"></div>

  <div class="mt-5">
    <a href="test.html" class="btn btn-back">RETURN TO MAIN PAGE</a>
  </div>
</div>

<footer class="py-4 mt-5 text-center" style="background: #1e003c; color: var(--school-gold);">
  <small>&copy; 2026 SMSH – Class of 1976</small>
</footer>

<script>
  // Script to build the gallery
  window.onload = function() {
    const photoGrid = document.getElementById('photoGrid');
    const totalPhotos = 75; 
    for (let i = 1; i <= totalPhotos; i++) {
      const col = document.createElement('div');
      col.className = 'col-lg-3 col-md-4 col-sm-6';
      col.innerHTML = `<div class="card photo-card shadow-sm"><div class="img-container"><img src="pic${i}.jpg" loading="lazy" onerror="this.closest('.col-lg-3').style.display='none'"></div></div>`;
      photoGrid.appendChild(col);
    }
  };

  // Script to Copy Email
  function copyAndNotify() {
    const email = "smshclassof76photos@gmail.com";
    const btn = document.getElementById('mainEmailBtn');
    const text = document.getElementById('instructionText');

    navigator.clipboard.writeText(email).then(() => {
      btn.innerText = "✅ COPIED!";
      btn.style.backgroundColor = "#28a745"; 
      text.innerHTML = "Success! Now open your email and paste the address.";
      text.style.color = "#28a745";

      setTimeout(() => {
        btn.innerText = email;
        btn.style.backgroundColor = "var(--school-purple)";
        text.innerHTML = "(Click the box above to copy)";
        text.style.color = "#6c757d";
      }, 4000);
    });
  }
</script>

</body>
</html>
