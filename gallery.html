<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; font-family: 'Segoe UI', Arial, sans-serif; }
    
    /* Navigation */
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar-brand { color: var(--school-gold) !important; font-weight: bold; }

    /* Submission Box Styling */
    .submission-box {
      background: white;
      border-left: 5px solid var(--school-gold);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 40px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h2 { color: var(--school-purple); font-weight: bold; }
    
    /* Photo Card Styling */
    .photo-card {
      border-radius: 12px;
      overflow: hidden;
      background: white;
      border: 1px solid #ddd;
      transition: all 0.3s ease;
      height: 100%;
    }
    .photo-card:hover { 
      transform: translateY(-5px); 
      border-color: var(--school-gold);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    .img-container { height: 250px; background: #f0f0f0; position: relative; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Spinner Styling */
    #loading-spinner { color: var(--school-purple); }

    .btn-back {
      background-color: var(--school-purple);
      color: var(--school-gold);
      border: 2px solid var(--school-gold);
      font-weight: bold;
      border-radius: 50px;
      padding: 12px 40px;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn-back:hover {
      background-color: var(--deep-purple);
      color: white;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="test.html">← BACK TO HOME</a>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center mb-5">
    <h2>Memory Gallery</h2>
    <p class="text-muted">St. Martinville Senior High — Class of 1976</p>
  </div>

  <div class="submission-box text-center mx-auto" style="max-width: 800px;">
    <h5 class="fw-bold" style="color: var(--deep-purple);">📸 Have photos to share?</h5>
    <p class="mb-2">We are looking for photos from our school days or past reunions!</p>
    <a href="mailto:yourname@email.com?subject=SMSH%201976%20Reunion%20Photos" 
       style="color: var(--school-purple); font-weight: bold; text-decoration: underline;">
       Click here to email your photos to us
    </a>
  </div>

  <div id="loading-spinner" class="text-center my-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Gathering memories...</p>
  </div>

  <div class="row g-4" id="photoGrid">
    </div>

  <div class="text-center mt-5">
    <a href="test.html" class="btn btn-back">RETURN TO MAIN PAGE</a>
  </div>
</div>

<footer class="py-4 mt-5 text-center" style="background: #1e003c; color: var(--school-gold);">
  <small>&copy; 2026 SMSH – Class of 1976</small>
</footer>

<script>
  // Script to generate the gallery automatically
  window.onload = function() {
    const photoGrid = document.getElementById('photoGrid');
    const spinner = document.getElementById('loading-spinner');
    
    // Total number of photos you plan to have named pic1.jpg, pic2.jpg, etc.
    const totalPhotos = 75; 

    for (let i = 1; i <= totalPhotos; i++) {
      const col = document.createElement('div');
      col.className = 'col-lg-3 col-md-4 col-sm-6';
      
      // We use onerror to hide the card if the image file doesn't exist yet
      col.innerHTML = `
        <div class="card photo-card shadow-sm">
          <div class="img-container">
            <img src="pic${i}.jpg" loading="lazy" alt="Class Memory" 
                 onerror="this.closest('.col-lg-3').style.display='none'">
          </div>
        </div>
      `;
      photoGrid.appendChild(col);
    }
    
    // Hide the spinner once the script has finished building the grid
    spinner.style.display = 'none';
  };
</script>

</body>
</html>
