<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Gallery - SMSH Class of '76</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; }
    body { background:#f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
    .gallery-header { background: var(--school-purple); color: var(--school-gold); padding: 3rem 1rem; border-bottom: 4px solid var(--school-gold); }
    .photo-card { border: none; transition: transform 0.3s ease; background: white; }
    .photo-card:hover { transform: translateY(-5px); }
    .img-container { overflow: hidden; cursor: pointer; height: 250px; border-radius: 8px 8px 0 0; }
    .gallery-img { width: 100%; height: 100%; object-fit: cover; }
    .caption-bar { background: white; border-top: 1px solid #eee; border-radius: 0 0 8px 8px; }
    .photo-name { color: var(--school-purple); font-weight: bold; font-size: 0.9rem; margin-bottom: 0; }
    #btn-back { background: var(--school-gold); color: var(--school-purple); font-weight: bold; border-radius: 50px; }
    #lightboxCaption { background: rgba(0,0,0,0.8); color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; }
  </style>
</head>
<body>

<header class="gallery-header text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">50th Reunion Gallery</h1>
    <p class="lead">Capturing memories from 1976 to 2026</p>
    <a href="test.html" class="btn px-4 mt-2" id="btn-back">← Back to Main Page</a>
  </div>
</header>

<main class="container py-5">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    
    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('pic1.jpg', 'Graduation Day - 1976')">
          <img src="pic1.jpg" class="gallery-img" alt="Memory 1">
        </div>
        <div class="card-body caption-bar text-center p-2">
          <p class="photo-name">STATE CHAMPS</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('pic2.jpg', 'Upward Bound')">
          <img src="pic2.jpg" class="gallery-img" alt="Memory 2">
        </div>
        <div class="card-bogdy caption-bar text-center p-2">
          <p class="photo-name">Upward Bound</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('pic3.jpg', 'The cool kids')">
          <img src="pic3.jpg" class="gallery-img" alt="Memory 3">
        </div>
        <div class="card-body caption-bar text-center p-2">
          <p class="photo-name">The cool kids</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('pic4.jpg', 'Jacqueline, Kevin, Megan')">
          <img src="pic4.jpg" class="gallery-img" alt="Memory 4">
        </div>
        <div class="card-body caption-bar text-center p-2">
          <p class="photo-name">Jacqueline, Kevin, Megan</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('pic5.jpg', 'Kevin, Mia, Khari')">
          <img src="pic5.jpg" class="gallery-img" alt="Memory 5">
        </div>
        <div class="card-body caption-bar text-center p-2">
          <p class="photo-name">Kevin R. at 17</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card photo-card shadow-sm h-100">
        <div class="img-container" onclick="openLightbox('Pic6.jpg', 'Kevin R. at 17')">
          <img src="pic6.jpg" class="gallery-img" alt="Memory 6">
        </div>
        <div class="card-body caption-bar text-center p-2">
          <p class="photo-name">Kevin, Mia, Khari</p>
        </div>
      </div>
    </div>

  </div> </main>

<div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0 text-center position-relative">
        <img src="" id="lightboxImg" class="img-fluid rounded-top shadow-lg" style="max-height: 80vh;">
        <div id="lightboxCaption" class="rounded-bottom text-center"></div>
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openLightbox(src, name) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxCaption').innerText = name;
    var myModal = new bootstrap.Modal(document.getElementById('photoModal'));
    myModal.show();
  }
</script>

</body>
</html>
