<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; }
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar-brand { color: var(--school-gold) !important; font-weight: bold; }
    h2 { color: var(--school-purple); font-weight: bold; }
    
    .photo-card { border-radius: 8px; overflow: hidden; background: white; border: 1px solid #ddd; transition: 0.3s; }
    .photo-card:hover { transform: scale(1.05); border-color: var(--school-gold); }
    
    .img-container { height: 200px; background: #eee; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="test.html">← BACK TO HOME</a>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center mb-5">
    <h2>Memory Gallery</h2>
    <p class="text-muted">Class of 1976 Memories</p>
  </div>

  <div class="row g-3" id="photoGrid"></div>

  <div class="text-center mt-5">
    <a href="test.html" class="btn btn-dark px-5">RETURN TO MAIN PAGE</a>
  </div>
</div>

<script>
  const photoGrid = document.getElementById('photoGrid');
  const totalPhotos = 75; // You can change this number as you add more

  for (let i = 1; i <= totalPhotos; i++) {
    const photoHTML = `
      <div class="col-lg-3 col-md-4 col-sm-6">
        <div class="card photo-card shadow-sm">
          <div class="img-container">
            <img src="pic${i}.jpg" loading="lazy" alt="Memory ${i}" onerror="this.parentElement.parentElement.parentElement.style.display='none'">
          </div>
        </div>
      </div>
    `;
    photoGrid.innerHTML += photoHTML;
  }
</script>

</body>
</html>
