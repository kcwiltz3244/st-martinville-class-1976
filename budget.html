<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reunion Budget - SMSH Class of '76</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; }
    body { background:#f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
    .gallery-header { background: var(--school-purple); color: var(--school-gold); padding: 3rem 1rem; border-bottom: 4px solid var(--school-gold); }
    .info-box { height: 100%; padding: 1.5rem; background: white; border-radius: 12px; border-top: 5px solid var(--school-purple); box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .btn-back { background: var(--school-gold); color: var(--school-purple); font-weight: bold; border-radius: 50px; }
    .table thead { background: var(--school-purple); color: var(--school-gold); border-bottom: 3px solid var(--school-gold); }
    .table-responsive { border-radius: 12px; overflow: hidden; border: 1px solid #ddd; background: white; }
  </style>
</head>
<body>

<header class="gallery-header text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Financial Overview</h1>
    <p class="lead">Class of 1976 Reunion Budget Tracking</p>
    <a href="index.html" class="btn px-4 mt-2 btn-back">← Back to Home</a>
  </div>
</header>

<main class="container py-5">
  <div class="row g-4 mb-5 text-center">
    <div class="col-md-4">
      <div class="info-box shadow-sm">
        <p class="text-muted fw-bold small">TOTAL DUES COLLECTED</p>
        <h2 class="fw-bold" id="total-collected" style="color: var(--school-purple);">$0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="info-box shadow-sm">
        <p class="text-muted fw-bold small">TOTAL EXPENSES</p>
        <h2 class="fw-bold text-danger" id="total-expenses">$0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="info-box shadow-sm" style="border-top: 5px solid var(--school-gold) !important;">
        <p class="text-muted fw-bold small">AVAILABLE BALANCE</p>
        <h2 class="fw-bold text-success" id="remaining-balance">$0</h2>
      </div>
    </div>
  </div>

  <div class="table-responsive shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th class="ps-4">CATEGORY</th>
          <th>DESCRIPTION</th>
          <th>ESTIMATED</th>
          <th>ACTUAL PAID</th>
          <th class="pe-4">STATUS</th>
        </tr>
      </thead>
      <tbody id="budgetTableBody">
        </tbody>
    </table>
  </div>
</main>

<script>
  const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtTwQGFMfz_ZLxnoD_U7crGvvjxMkRMsolyXCC3t3OL_dPtno6dxKhhn8Gr6LZPXT8X61QC_ZOP5It/pub?gid=0&single=true&output=csv';

  fetch(csvUrl)
    .then(res => res.text())
    .then(csvText => {
      const rows = csvText.split('\n').map(row => row.split(','));

      // Summary Boxes (Rows 1-3)
      document.getElementById('total-collected').innerText = "$" + (rows[0][1] || "0").trim();
      document.getElementById('total-expenses').innerText = "$" + (rows[1][1] || "0").trim();
      document.getElementById('remaining-balance').innerText = "$" + (rows[2][1] || "0").trim();

      let tableHtml = '';
      // We skip the header rows and specifically look for rows with content starting at index 7
      for (let i = 7; i < rows.length; i++) { 
        const category = (rows[i][0] || "").trim();
        
        // This stops the "Duplicate Line" by only allowing actual categories 
        // and skipping any row that says "Category" again
        if (category !== "" && category.toLowerCase() !== "category") {
          const description = rows[i][1] || "";
          const estimated   = rows[i][2] || "0";
          const actualPaid  = rows[i][3] || "0";
          const statusText  = rows[i][4] || "Pending";
          
          const badgeClass = statusText.toLowerCase().includes('paid') ? 'bg-success' : 'bg-warning text-dark';
          
          tableHtml += `
            <tr>
              <td class="ps-4 fw-bold">${category}</td>
              <td>${description}</td>
              <td>$${estimated}</td>
              <td>$${actualPaid}</td>
              <td class="pe-4"><span class="badge ${badgeClass}">${statusText}</span></td>
            </tr>`;
        }
      }
      document.getElementById('budgetTableBody').innerHTML = tableHtml;
    })
    .catch(err => console.error("Could not load spreadsheet:", err));
</script>

</body>
</html>
