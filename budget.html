<section id="budget" class="py-5 bg-light border-top">
  <div class="container">
    <h2 class="text-center fw-bold mb-4" style="color: var(--school-purple);">Reunion Budget</h2>
    
    <div class="row g-4 text-center mb-5">
      <div class="col-md-4">
        <div class="info-box shadow-sm">
          <p class="text-muted mb-1">Total Collected</p>
          <h2 class="fw-bold" id="web-collected" style="color: var(--school-purple);">$0</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-box shadow-sm">
          <p class="text-muted mb-1">Total Paid</p>
          <h2 class="fw-bold text-danger" id="web-paid">$0</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-box shadow-sm" style="border-top: 5px solid var(--school-gold) !important;">
          <p class="text-muted mb-1">Available Balance</p>
          <h2 class="fw-bold text-success" id="web-balance">$0</h2>
        </div>
      </div>
    </div>

    <div class="table-responsive shadow-sm bg-white rounded">
      <table class="table table-hover align-middle mb-0">
        <thead style="background: var(--school-purple); color: white;">
          <tr>
            <th>Category</th>
            <th>Estimate</th>
            <th>Paid</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="budgetTableBody">
          </tbody>
      </table>
    </div>
  </div>
</section>

<script>
  // Replace the URL below with your "Publish to Web" CSV link
  const spreadsheetUrl = 'REPLACE_WITH_YOUR_CSV_URL_HERE';

  fetch(spreadsheetUrl)
    .then(response => response.text())
    .then(csvText => {
      const rows = csvText.split('\n').map(row => row.split(','));
      
      // Pulling totals from your specific cells (B1, B2, B3)
      document.getElementById('web-collected').innerText = "$" + rows[0][1];
      document.getElementById('web-paid').innerText = "$" + rows[1][1];
      document.getElementById('web-balance').innerText = "$" + rows[2][1];

      // Pulling individual expenses (Rows 8, 9, 10)
      let tableHtml = '';
      for (let i = 7; i <= 9; i++) {
        if (rows[i]) {
          tableHtml += `<tr>
            <td>${rows[i][0]}</td>
            <td>$${rows[i][2]}</td>
            <td>$${rows[i][3]}</td>
            <td><span class="badge ${rows[i][4].includes('Paid') ? 'bg-success' : 'bg-warning text-dark'}">${rows[i][4]}</span></td>
          </tr>`;
        }
      }
      document.getElementById('budgetTableBody').innerHTML = tableHtml;
    });
</script>
