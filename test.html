<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class of 1976 - 50th Reunion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; color:#333; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
    
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar a.nav-link { color:white !important; font-weight:bold; text-transform: uppercase; font-size: 0.8rem; }
    
    header {
      position:relative; background:url("tiger.png") center/cover no-repeat;
      color:var(--school-gold); text-align:center; padding:5rem 1rem;
    }
    header::after { content:""; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(30,0,60,0.5); z-index:0; }
    header .container { position:relative; z-index:1; }
    
    .timer-band { background: var(--deep-purple); color: white; padding: 20px 0; text-align: center; border-top: 4px solid var(--school-gold); border-bottom: 4px solid var(--school-gold); }
    .countdown-flex { display: flex; justify-content: center; gap: 25px; font-weight: bold; }
    .unit-num { font-size: 2.5rem; display: block; line-height: 1; color: var(--school-gold); }
    .unit-label { font-size: 0.7rem; text-transform: uppercase; }

    /* Button Styling */
    .btn-zelle { background: #6d1ed1; color: white !important; border-radius: 50px; padding: 15px 45px; font-weight: bold; border: 2px solid white; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; font-size: 1.2rem; }
    .btn-zelle:hover { background: #4b0082; transform: scale(1.05); color: var(--school-gold) !important; }

    .btn-notes { border: 2px solid var(--school-purple); color: var(--school-purple); border-radius: 30px; padding: 10px 25px; font-weight: bold; text-decoration: none; transition: 0.3s; display: inline-block; margin-bottom: 20px; }
    .btn-notes:hover { background: var(--school-purple); color: white !important; }

    .rsvp-status-pill { background: var(--deep-purple); color: var(--school-gold); border: 2px solid var(--school-gold); border-radius: 50px; padding: 15px 40px; display: inline-block; margin-bottom: 20px; }
    #yesListContainer { border-radius: 12px; background: white; border: 1px solid #dee2e6; max-height: 280px; overflow-y: auto; }
    .rsvp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    @media (min-width: 768px) { .rsvp-grid { grid-template-columns: repeat(5, 1fr); } }
    .attendee-name { font-size: 0.82rem; padding: 4px; background: #f8f9fa; border: 1px solid #eee; border-radius: 4px; text-align: center; font-weight: bold; color: var(--deep-purple); }

    /* MEMORIAL LAYOUT */
    .memorial-list { list-style: none; padding: 0; margin: 0; }
    .memorial-list li { margin-bottom: 8px; font-size: 0.95rem; white-space: nowrap; font-family: 'Georgia', serif; color: #4b0082; }
    @media (max-width: 768px) {
        .memorial-list li { font-size: 0.75rem; }
        .mobile-half { width: 50% !important; flex: 0 0 50%; }
    }

    #btn-back-to-top { position: fixed; bottom: 20px; right: 20px; display: none; z-index: 1000; background: var(--school-purple); color: var(--school-gold); border: 2px solid var(--school-gold); width: 45px; height: 45px; border-radius: 50%; }
  </style> 
</head>

<body id="top">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#" style="color: var(--school-gold) !important;">SMSH '76</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link px-2" href="#rsvp">Who's Coming</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#calendar">Meetings</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#payments">Dues</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#music">Music</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#tasks">Tasks</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#memorial">Memorial</a></li>
      </ul>
    </div>
  </div>
</nav>

<header>
  <div class="container text-center">
    <h1 class="fw-bold display-4">ST. MARTINVILLE SENIOR HIGH</h1>
    <h2 style="color:var(--school-gold);">Class of 1976 — 50th Reunion</h2>
  </div>
</header>

<section class="timer-band">
  <div class="container">
    <div class="countdown-flex">
      <div><span class="unit-num" id="days">00</span><span class="unit-label">Days</span></div>
      <div><span class="unit-num" id="hours">00</span><span class="unit-label">Hrs</span></div>
      <div><span class="unit-num" id="mins">00</span><span class="unit-label">Min</span></div>
      <div><span class="unit-num" id="secs">00</span><span class="unit-label">Sec</span></div>
    </div>
  </div>
</section>

<section id="rsvp" class="py-5 bg-light border-bottom">
  <div class="container text-center">
    <h2 class="mb-4 fw-bold" style="color: var(--school-purple);">Who's Coming?</h2>
    <div class="rsvp-status-pill shadow">
      <h4 class="mb-0 fw-bold"><span id="finalTotal">...</span> Classmates & Guests Confirmed!</h4>
    </div>
    <div class="mb-4 text-center">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdNH2rLwb6w9zvIE113HT4Ru0yNCUORL29ijm2Jg4Ws2Bu8sA/viewform" target="_blank" class="btn btn-lg fw-bold" style="background: var(--school-purple); color: var(--school-gold); border-radius: 50px; padding: 12px 40px;">📝 RSVP HERE</a>
    </div>
    <div id="yesListContainer" class="p-3 shadow-sm mx-auto" style="max-width: 1000px;">
        <div class="rsvp-grid" id="attendeeGrid"></div>
    </div>
  </div>
</section>

<section id="calendar" class="py-5 bg-white border-bottom text-center">
  <div class="container">
    <h2 class="mb-4 fw-bold" style="color: var(--school-purple);">Meetings & Events</h2>
    <a href="#" target="_blank" class="btn-notes shadow-sm">📋 View Meeting Notes</a>
