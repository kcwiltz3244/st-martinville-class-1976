<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class of 1976 - 50th Reunion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple:#2a004a; }
body { background:#fafafa; color:#333; font-family: 'Segoe UI', Arial, sans-serif; }

.navbar { background-color:var(--school-purple); border-bottom:2px solid var(--school-gold); }
.navbar a.nav-link { color:white !important; font-weight:bold; }
.navbar a.nav-link:hover { color:var(--school-gold) !important; }

header {
  background:url("tiger.png") center/cover no-repeat;
  color:var(--school-gold);
  text-align:center;
  padding:5rem 1rem;
  position:relative;
}
header::after {
  content:""; position:absolute; inset:0;
  background:rgba(30,0,60,0.6);
}
header .container { position:relative; z-index:1; }

h2 { color:var(--school-purple); font-weight:bold; text-align:center; margin-bottom:1.5rem; }

/* Gallery */
.gallery img {
  cursor:pointer;
  transition: transform .3s ease, box-shadow .3s ease;
}
.gallery img:hover {
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

/* Lightbox */
.lightbox {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.lightbox img {
  max-width:92%;
  max-height:82%;
  border-radius:10px;
}
.lightbox span {
  position:absolute;
  font-size:2.5rem;
  color:white;
  cursor:pointer;
  user-select:none;
}
.lightbox .close { top:15px; right:25px; }
.lightbox .prev { left:20px; top:50%; transform:translateY(-50%); }
.lightbox .next { right:20px; top:50%; transform:translateY(-50%); }
.lightbox .caption { color:#ddd; margin-top:10px; font-size:.9rem; }

#btn-back-to-top {
  position: fixed; bottom: 20px; right: 20px; display: none;
  background: var(--school-purple); color: var(--school-gold);
  border: 2px solid var(--school-gold); width: 45px; height: 45px;
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="#" style="color:var(--school-gold)">SMSH '76 REUNION</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto fw-bold text-uppercase">
<li class="nav-item"><a class="nav-link" href="#photos">Photos</a></li>
</ul>
</div>
</div>
</nav>

<header>
<div class="container">
<h1 class="fw-bold display-4">St. Martinville Senior High</h1>
<h2 style="color:var(--school-gold)">Class of 1976 — 50th Reunion</h2>
</div>
</header>

<!-- PHOTO GALLERY SECTION -->
<section id="photos" class="py-5 bg-light">
<div class="container">
<h2>Memories Through The Years</h2>
<p class="text-center text-muted mb-4">
Click any photo to view fullscreen slideshow
</p>

<div class="row g-3 gallery">
<div class="col-6 col-md-4 col-lg-3">
<img src="photos/01.jpg" class="img-fluid rounded shadow-sm" alt="Freshman Year">
</div>
<div class="col-6 col-md-4 col-lg-3">
<img src="photos/02.jpg" class="img-fluid rounded shadow-sm" alt="Senior Prom">
</div>
<div class="col-6 col-md-4 col-lg-3">
<img src="photos/03.jpg" class="img-fluid rounded shadow-sm" alt="Graduation Day">
</div>
<div class="col-6 col-md-4 col-lg-3">
<img src="photos/04.jpg" class="img-fluid rounded shadow-sm" alt="Past Reunion">
</div>
</div>
</div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
<span class="close" id="closeLightbox">&times;</span>
<span class="prev" id="prevImg">&#10094;</span>
<img id="lightboxImg">
<span class="next" id="nextImg">&#10095;</span>
<div class="caption" id="lightboxCaption"></div>
</div>

<footer class="py-4 text-center" style="background:#1e003c">
<p style="color:var(--school-gold); font-weight:bold;">
&copy; 2026 St. Martinville Sr. High – Class of 1976
</p>
</footer>

<button type="button" class="btn rounded-circle shadow" id="btn-back-to-top">↑</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// LIGHTBOX
const galleryImages = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const caption = document.getElementById("lightboxCaption");
let currentIndex = 0;

galleryImages.forEach((img, index) => {
  img.addEventListener("click", () => {
    currentIndex = index;
    showLightbox();
  });
});

function showLightbox() {
  lightbox.style.display = "flex";
  lightboxImg.src = galleryImages[currentIndex].src;
  caption.textContent = galleryImages[currentIndex].alt;
}

function hideLightbox() {
  lightbox.style.display = "none";
}

document.getElementById("closeLightbox").addEventListener("click", hideLightbox);

document.getElementById("nextImg").addEventListener("click", () => {
  currentIndex = (currentIndex + 1) % galleryImages.length;
  showLightbox();
});

document.getElementById("prevImg").addEventListener("click", () => {
  currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
  showLightbox();
});

document.addEventListener("keydown", e => {
  if (lightbox.style.display === "flex") {
    if (e.key === "ArrowRight") nextImg.click();
    if (e.key === "ArrowLeft") prevImg.click();
    if (e.key === "Escape") hideLightbox();
  }
});

// BACK TO TOP
const mybutton = document.getElementById("btn-back-to-top");
window.onscroll = () => {
  mybutton.style.display = (document.documentElement.scrollTop > 200) ? "block" : "none";
};
mybutton.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
</script>

</body>
</html>
