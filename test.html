<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class of 1976 - 50th Reunion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; color:#333; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
    
    /* Navigation */
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar a.nav-link { color:white !important; font-weight:bold; }
    .navbar a.nav-link:hover { color: var(--school-gold) !important; }
    
    /* Header - RESTORED TIGER.PNG */
    header {
      position:relative;
      background:url("tiger.png") center/cover no-repeat;
      color:var(--school-gold);
      text-align:center;
      padding:5rem 1rem;
    }
    header::after {
      content:""; position:absolute; top:0; left:0; width:100%; height:100%;
      background:rgba(30,0,60,0.6); z-index:0;
    }
    header .container { position:relative; z-index:1; }

    /* Countdown */
    #countdown { background: var(--deep-purple); color: white; padding: 25px 0; border-bottom: 4px solid var(--school-gold); }
    .countdown-number { display: block; font-size: 2.2rem; font-weight: bold; color: var(--school-gold); }
    .countdown-label { font-size: 0.75rem; text-transform: uppercase; color: #bbb; }

    /* RSVP Grid */
    #yesListContainer { border-radius: 12px; background: #f8f9fa; border: 1px solid #dee2e6; max-height: 280px; overflow-y: auto; }
    .rsvp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    @media (min-width: 768px) { .rsvp-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 992px) { .rsvp-grid { grid-template-columns: repeat(6, 1fr); } }
    .attendee-name { font-size: 0.82rem; padding: 4px 6px; background: white; border: 1px solid #e9ecef; border-radius: 4px; text-align: center; color: var(--deep-purple); }

    /* Animations */
    .reveal-item { opacity: 0; transform: translateY(20px); transition: all 0.8s ease-out; }
    .reveal-item.visible { opacity: 1; transform: translateY(0); }

    /* Memorial Style */
    .memorial-list { font-family: 'Georgia', serif; color: #4a148c; line-height: 1.4; }
    @media (max-width: 768px) {
      .memorial-list { font-size: 0.65rem !important; }
      .memorial-list li { margin-bottom: 4px !important; }
    }

    h2 { color:var(--school-purple); font-weight: bold; margin-bottom: 1.5rem; text-align: center; }
    #btn-back-to-top {
      position: fixed; bottom: 20px; right: 20px; display: none; z-index: 1000;
      background: var(--school-purple); color: var(--school-gold);
      border: 2px solid var(--school-gold); width: 45px; height: 45px;
    }
  </style> 
</head>
