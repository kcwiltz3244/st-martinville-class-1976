<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class of 1976 - 50th Reunion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; color:#333; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
    
    .navbar { background-color:var(--school-purple); border-bottom: 2px solid var(--school-gold); }
    .navbar a.nav-link { color:white !important; font-weight:bold; }
    
    header {
      position:relative; background:url("tiger.png") center/cover no-repeat;
      color:var(--school-gold); text-align:center; padding:4rem 1rem;
    }
    header::after { content:""; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(30,0,60,0.6); z-index:0; }
    header .container { position:relative; z-index:1; }

    #countdown { background: var(--deep-purple); color: white; padding: 20px 0; border-bottom: 4px solid var(--school-gold); }
    .countdown-number { display: block; font-size: 2rem; font-weight: bold; color: var(--school-gold); }

    /* Memorial Fix: Forces even spacing and prevents spillover */
    .memorial-list { font-family: 'Georgia', serif; color: #4a148c; }
    .memorial-list ul { padding: 0; list-style: none; margin-bottom: 0; }
    .memorial-list li { margin-bottom: 8px; font-size: 0.95rem; white-space: nowrap; }
    
    @media (max-width: 768px) {
      .memorial-list li { font-size: 0.7rem !important; }
      .row-cols-mobile-2 > .col { width: 50% !important; flex: 0 0 50%; }
    }

    .zelle-card { border-top: 6px solid #6d1ed1 !important; border-radius: 15px; }
  </style> 
</head>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#" style="color: var(--school-gold) !important;">SMSH '76</a>
    <div class="ms-auto d-flex">
      <a class="nav-link px-2 text-white small" href="#rsvp">RSVP</a>
      <a class="nav-link px-2 text-white small" href="#payments">DUES</a>
      <a class="nav-link px-2 text-white small" href="#memorial">MEMORIAL</a>
    </div>
  </div>
</nav>

<header>

  </div>
</section>

    <div class="alert shadow mx-auto" style="max-width: 400px; background: var(--deep-purple); border: 2px solid var(--school-gold); color: var(--school-gold);">
      <h4 class="mb-0 fw-bold"><span id="finalTotal">0</span> Confirmed!</h4>
    </div>
    <a href="#" class="btn btn-lg mt-3" style="background: var(--school-purple); color: var(--school-gold); border-radius: 50px; font-weight: bold;">📝 RSVP HERE</a>
  </div>
</section>
