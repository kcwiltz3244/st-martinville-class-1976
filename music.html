<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Requests - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { 
      --school-purple: #4b0082; 
      --school-gold: #ffd700; 
      --deep-purple: #2a004a; 
    }
    body { 
      background: #fafafa; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #333;
    }
    
    /* Header Section */
    .music-header { 
      background: var(--school-purple); 
      color: var(--school-gold); 
      padding: 60px 0; 
      border-bottom: 5px solid var(--school-gold); 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    /* Cards for Form and List */
    .jukebox-card { 
      background: white; 
      border-radius: 20px; 
      border: 1px solid #dee2e6; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
      overflow: hidden;
      margin-bottom: 30px;
    }
    .card-label {
      background: var(--deep-purple);
      color: var(--school-gold);
      padding: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Button Style */
    .btn-home { 
      background: var(--school-gold); 
      color: var(--deep-purple); 
      font-weight: bold; 
      border-radius: 50px; 
      padding: 12px 35px; 
      text-decoration: none; 
      border: 2px solid var(--school-purple);
      transition: 0.3s;
    }
    .btn-home:hover { 
      background: white; 
      color: var(--school-purple); 
    }

    iframe { width: 100%; border: none; }
  </style>
</head>
<body>

<div class="music-header text-center">
  <div class="container">
    <h1 class="fw-bold display-4">🎵 THE REUNION JUKEBOX</h1>
    <p class="lead mb-4">What songs remind you of 1972 - 1976? Add them to our 50th Reunion Playlist!</p>
    <a href="test.html" class="btn-home">← BACK TO HOME</a>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4">
    
    <div class="col-lg-5">
      <div class="jukebox-card">
        <div class="card-label">1. Submit Your Song</div>
        <div class="p-3">
          <iframe src="YOUR_GOOGLE_FORM_LINK_HERE?embedded=true" height="700">Loading…</iframe>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="jukebox-card">
        <div class="card-label">2. Current Requests</div>
        <div class="p-3">
          <p class="text-center text-muted small">Scroll down to see all songs requested so far.</p>
          <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT_YOUR_PUBLISHED_ID/pubhtml?widget=true&headers=false" height="660"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="py-5 text-center" style="background: var(--deep-purple); color: var(--school-gold);">
  <div class="container">
    <p class="mb-0 fw-bold">St. Martinville Senior High — Class of 1976</p>
    <small class="opacity-75">50th Reunion Planning Committee</small>
  </div>
</footer>

</body>
</html>
