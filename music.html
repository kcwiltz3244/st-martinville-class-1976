<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Requests - SMSH Class of 1976</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --school-purple:#4b0082; --school-gold:#ffd700; --deep-purple: #2a004a; }
    body { background:#fafafa; font-family: 'Segoe UI', Arial, sans-serif; }
    .music-header { background: var(--school-purple); color: var(--school-gold); padding: 50px 0; border-bottom: 5px solid var(--school-gold); }
    .section-title { color: var(--school-purple); font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid var(--school-gold); display: inline-block; }
    .info-card { background: white; border-radius: 15px; border: 1px solid #ddd; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    iframe { border-radius: 10px; border: 1px solid #ccc; width: 100%; }
    .btn-home { background: var(--school-gold); color: var(--deep-purple); font-weight: bold; border-radius: 50px; padding: 10px 30px; text-decoration: none; border: 2px solid var(--school-purple); }
  </style>
</head>
<body>

<div class="music-header text-center">
  <div class="container">
    <h1 class="fw-bold display-5">🎵 THE REUNION JUKEBOX</h1>
    <p class="lead">Request a song and see the playlist grow!</p>
    <a href="test.html" class="btn-home mt-3 d-inline-block">← BACK TO HOME</a>
  </div>
</div>

<div class="container py-5">
  <div class="row g-5">
    
    <div class="col-lg-5">
      <h3 class="section-title">1. Add a Song</h3>
      <div class="info-card">
        <p class="text-muted small">Enter the Artist and Song Title below:</p>
        <iframe src="PASTE_YOUR_GOOGLE_FORM_LINK_HERE?embedded=true" height="600" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
      </div>
    </div>

    <div class="col-lg-7">
      <h3 class="section-title">2. Current Playlist</h3>
      <div class="info-card">
        <p class="text-muted small">Here is what your classmates have already requested:</p>
        <iframe src="PASTE_YOUR_PUBLISHED_SHEET_LINK_HERE" height="600" frameborder="0"></iframe>
      </div>
    </div>

  </div>
</div>

<footer class="py-4 text-center" style="background: var(--deep-purple); color: var(--school-gold);">
  <p class="mb-0">&copy; 2026 SMSH Class of 1976</p>
</footer>

</body>
</html>
